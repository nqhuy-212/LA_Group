# Stack production trên VPS (Tino, 4GB RAM — xem tech-stack.md). Image `backend`/
# `frontend` PHẢI được build ở CI rồi push lên GHCR — không build trên VPS (RAM thấp
# chắc chắn OOM lúc `npm run build`). VPS chỉ chạy `docker compose pull && up`.
#
# LUÔN chạy qua `./scripts/dc.sh` (tự kèm `--env-file .env.prod`). Gọi `docker compose`
# trần sẽ khiến mọi `${...}` bên dưới rỗng: `env_file:` chỉ nạp biến VÀO TRONG
# container, không dùng cho phép thay thế biến ở chính file này.

x-logging: &default-logging
  # Driver json-file mặc định KHÔNG giới hạn dung lượng — nginx + uvicorn access log
  # khoảng 50MB/ngày sẽ ăn hết 30GB đĩa trong vòng một năm. Đây là nguyên nhân số 1
  # làm chết VPS nhỏ. Trần cứng: 6 service × 10m × 3 file = 180MB.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # Mặc định Postgres giả định sở hữu cả máy (effective_cache_size 4GB,
    # max_connections 100). App chỉ dùng tối đa 15 connection (pool 5 + overflow 10).
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=50
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Không publish port ra host — chỉ giao tiếp qua network Docker nội bộ
    # (Postgres/FastAPI/n8n không bao giờ expose trực tiếp, xem tech-stack.md/security.md).
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.prod
    environment:
      ENVIRONMENT: prod
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    logging: *default-logging
    # CỐ Ý không dùng `env_file: .env.prod` — frontend chỉ cần 2 biến dưới đây.
    # Nạp cả file sẽ đẩy POSTGRES_PASSWORD / JWT_SECRET_KEY / OPENAI_API_KEY vào
    # môi trường tiến trình Node mà nó không bao giờ dùng tới, mở rộng thiệt hại
    # vô ích nếu Next server bị khai thác (SSRF/RCE).
    environment:
      NODE_ENV: production
      # BẮT BUỘC: trong container frontend, "localhost" là chính nó chứ không phải
      # backend. Thiếu biến này thì lib/api/client.ts rơi về http://localhost:8000
      # và MỌI Server Component fetch thất bại — site lên nhưng rỗng dữ liệu, và
      # (internal)/layout.tsx gọi /api/auth/me hỏng nên không vào được Dashboard.
      INTERNAL_API_URL: http://backend:8000
      # Biến runtime (không phải NEXT_PUBLIC_*) — đổi domain không cần build lại image.
      SITE_URL: ${SITE_URL}
      # Docker tự set HOSTNAME=<container ID> cho mọi container; server.js chuẩn
      # (output "standalone") đọc thẳng process.env.HOSTNAME làm địa chỉ bind
      # (`server.js`: `const hostname = process.env.HOSTNAME || '0.0.0.0'`). Vì
      # /etc/hosts trong container map container-ID đó về đúng IP bridge của nó
      # (không phải 127.0.0.1), Next chỉ lắng nghe trên IP đó — traffic qua nginx
      # (gọi bằng tên service `frontend`, trùng IP) vẫn thông, nhưng healthcheck
      # gọi `localhost` bị ECONNREFUSED, báo "unhealthy" liên tục dù site chạy
      # bình thường (phát hiện qua deploy thật: `docker inspect` cho thấy
      # FailingStreak hàng trăm lần từ lúc container start). Ép về 0.0.0.0.
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Chỉ thay thế ${DOMAIN} trong template; nếu không lọc, envsubst sẽ nuốt luôn
      # $host / $scheme / $proxy_add_x_forwarded_for của nginx thành chuỗi rỗng.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      # NGINX_CONF=bootstrap.conf.template cho lần chạy đầu (chưa có cert),
      # đổi sang lahr.conf.template sau khi certbot cấp xong. Xem VPS.md §6.
      - ./nginx/${NGINX_CONF}:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    mem_limit: 128m
    # Certbot gia hạn cert trong volume dùng chung, nhưng nginx đã nạp cert cũ vào
    # bộ nhớ và không tự biết. Không reload thì sau ~60-90 ngày site phục vụ cert
    # hết hạn — lỗi câm, không ai biết tới khi khách phản ánh. Tự reload mỗi 6h rẻ
    # và an toàn hơn nhiều so với mount docker socket vào container certbot.
    #
    # Ghi đè `command:` khiến entrypoint gốc của image nginx (docker-entrypoint.sh)
    # BỎ QUA bước envsubst-templates: nó chỉ tự render /etc/nginx/templates/*.template
    # khi argv[1] là "nginx"/"nginx-debug", còn ở đây argv[1] là "sh" — phát hiện qua
    # test thật trên VPS (curl /healthz ra 404, conf.d/default.conf vẫn là file mặc
    # định của image, không phải bản đã envsubst). Gọi tường minh script gốc trước
    # khi start nginx để không phải tự chép lại logic filter của nó.
    #
    # `&&` rồi `&` KHÔNG tự nhiên tuần tự — `A && B & C` là `(A && B) &` chạy nền
    # SONG SONG với `C`, nên `exec nginx` khởi động ngay, không đợi envsubst ghi
    # xong conf.d/default.conf (race condition, cũng phát hiện qua test thật: file
    # trên đĩa đúng nhưng nginx đang chạy vẫn phục vụ config cũ). Phải để envsubst
    # chạy xong (đứng một mình, không có `&`) rồi mới `&&` sang phần còn lại.
    command: >
      sh -c "/docker-entrypoint.d/20-envsubst-on-templates.sh &&
             (while :; do sleep 6h & wait $${!}; nginx -s reload; done &) &&
             exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:v5.1.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    mem_limit: 128m
    # Lệnh xin chứng chỉ LẦN ĐẦU chạy tay (xem VPS.md §6), container này chỉ lo
    # gia hạn định kỳ (Let's Encrypt hết hạn 90 ngày). Nginx tự reload mỗi 6h ở trên.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  # n8n CHỈ dùng cho tích hợp nhẹ (webhook ứng viên mới), không phải core dependency
  # — bật bằng `./scripts/dc.sh --profile automation up -d` (tech-stack.md).
  # Mặc định TẮT để tiết kiệm ~400MB RAM trên máy 4GB.
  n8n:
    image: n8nio/n8n:1.129.0
    restart: unless-stopped
    logging: *default-logging
    profiles: ["automation"]
    # Không nạp .env.prod: n8n không dùng biến nào của app, mà nạp cả file sẽ đẩy
    # mật khẩu DB + OPENAI_API_KEY vào một container chạy workflow do người dùng
    # tự soạn — đúng chỗ không nên có secret của hệ thống.
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 512m

volumes:
  db_data:
  uploads:
  certbot_www:
  certbot_certs:
  n8n_data:
