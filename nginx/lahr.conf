# D5: một origin qua Nginx — "/" -> Next.js (frontend), "/api/" -> FastAPI (backend).
# Dev dùng next.config.ts rewrites() để mô phỏng; ở prod Nginx đảm nhiệm việc này.

server {
    listen 80;
    server_name lahr.vn www.lahr.vn;

    # Certbot xác thực domain qua webroot trước khi cấp/gia hạn chứng chỉ.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lahr.vn www.lahr.vn;

    ssl_certificate     /etc/letsencrypt/live/lahr.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lahr.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Giới hạn upload CV (MAX_UPLOAD_BYTES=5MB ở backend) + headroom cho multipart overhead.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # get_client_ip (app/core/rate_limit.py) chỉ tin header này khi ENVIRONMENT=prod —
        # đúng vì đây là hop đầu tiên từ internet, không có proxy nào phía trước Nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/chat trả SSE streaming — cần timeout dài hơn request thường; upstream
        # (app/api/v1/public/chat.py) tự set header X-Accel-Buffering: no để Nginx không
        # buffer response, chữ mới chạy dần theo stream thay vì đợi xong mới hiện.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
